<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointment Assistant — Live Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #ffffff;
      --bg-alt:       #f8fafc;
      --border:       #e2e8f0;
      --text:         #0f172a;
      --text-muted:   #475569;
      --text-light:   #94a3b8;
      --accent:       #2563eb;
      --accent-hover: #1d4ed8;
      --accent-light: #eff6ff;
      --radius:       8px;
      --shadow:       0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ── Header ─────────────────────────────────────────────────── */
    .demo-header {
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 200;
    }
    .demo-header .inner {
      max-width: 720px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .demo-header .back {
      font-size: 14px;
      color: var(--text-muted);
      text-decoration: none;
      white-space: nowrap;
    }
    .demo-header .back:hover { color: var(--accent); }
    .demo-header .title {
      flex: 1;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
    }
    .reset-btn {
      font-size: 13px;
      padding: 6px 14px;
      border-radius: var(--radius);
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--text-muted);
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: border-color 0.15s, color 0.15s;
    }
    .reset-btn:hover { border-color: #fca5a5; color: #dc2626; }

    /* ── Scenarios panel ────────────────────────────────────────── */
    .scenarios-panel {
      background: var(--bg-alt);
      border-bottom: 1px solid var(--border);
      padding: 20px 0;
    }
    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-light);
      margin-bottom: 12px;
    }
    .scenarios { display: flex; flex-direction: column; gap: 8px; }

    .scenario-card {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 14px 18px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      width: 100%;
      box-shadow: var(--shadow);
      transition: border-color 0.15s, background 0.15s;
    }
    .scenario-card:hover  { border-color: var(--text-light); }
    .scenario-card.active { border-color: var(--accent); background: var(--accent-light); }

    .scenario-radio {
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 2px solid var(--border);
      flex-shrink: 0;
      margin-top: 2px;
      transition: border-color 0.15s, background 0.15s;
    }
    .scenario-card.active .scenario-radio {
      border-color: var(--accent);
      background: var(--accent);
      box-shadow: inset 0 0 0 3px var(--accent-light);
    }
    .scenario-body  { flex: 1; }
    .scenario-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
    .scenario-sub   { font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
    .scenario-tags  { display: flex; gap: 6px; flex-wrap: wrap; }
    .scenario-tag {
      font-size: 11px; font-weight: 500;
      padding: 2px 8px; border-radius: 100px;
      border: 1px solid var(--border);
      color: var(--text-muted); background: var(--bg);
    }
    .scenario-tag.ok      { color: #16a34a; border-color: #bbf7d0; background: #f0fdf4; }
    .scenario-tag.fee     { color: #dc2626; border-color: #fecaca; background: #fef2f2; }
    .scenario-tag.pending { color: #d97706; border-color: #fde68a; background: #fffbeb; }

    /* ── Chat thread ────────────────────────────────────────────── */
    .chat-main { flex: 1; }
    .chat-thread {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── Message bubbles ─────────────────────────────────────────── */
    .msg           { display: flex; flex-direction: column; }
    .msg-user      { align-items: flex-end; }
    .msg-assistant { align-items: flex-start; }

    .msg-bubble {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.65;
    }
    .msg-user .msg-bubble {
      background: var(--accent);
      color: #fff;
      border-radius: 14px 14px 4px 14px;
    }
    .msg-assistant .msg-bubble {
      background: var(--bg-alt);
      border: 1.5px solid var(--border);
      color: var(--text);
      border-radius: 4px 14px 14px 14px;
    }
    .msg-assistant.success .msg-bubble { border-color: #86efac; background: #f0fdf4; }
    .msg-assistant.error   .msg-bubble { border-color: #fca5a5; background: #fef2f2; }
    .msg-assistant.pending .msg-bubble { border-color: #fde68a; background: #fffbeb; }

    .msg-welcome { color: var(--text-muted); font-size: 14px; font-style: italic; }
    .msg-text    { white-space: pre-wrap; }

    /* ── Typing indicator ────────────────────────────────────────── */
    .typing-dots { display: flex; gap: 5px; align-items: center; padding: 4px 0; }
    .typing-dots span {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--text-light);
      animation: tdot 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes tdot {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.6; }
      30%            { transform: translateY(-5px); opacity: 1; }
    }

    /* ── Confirmation actions (inline in bubble) ─────────────────── */
    .confirm-actions { display: flex; gap: 10px; margin-top: 14px; }
    .confirm-btn {
      padding: 7px 20px; border-radius: var(--radius);
      font-size: 14px; font-weight: 600;
      cursor: pointer; font-family: inherit; border: none;
      transition: background 0.15s;
    }
    .confirm-btn.yes { background: var(--accent); color: #fff; }
    .confirm-btn.yes:hover { background: var(--accent-hover); }
    .confirm-btn.no  { background: var(--bg); color: var(--text-muted); border: 1.5px solid var(--border); }
    .confirm-btn.no:hover  { border-color: var(--text-light); }

    /* ── Per-message audit trail ─────────────────────────────────── */
    .msg-audit { max-width: 85%; margin-top: 4px; }
    .msg-audit .audit-header {
      display: flex; align-items: center; gap: 10px;
      cursor: pointer; padding: 10px 0;
      border-top: 1px solid var(--border);
      user-select: none;
    }
    .msg-audit .audit-title  { font-size: 13px; font-weight: 600; flex: 1; color: var(--text-muted); }
    .msg-audit .audit-toggle { color: var(--text-light); transition: transform 0.2s; font-size: 12px; }
    .msg-audit .audit-toggle.open { transform: rotate(180deg); }

    /* ── Audit steps ─────────────────────────────────────────────── */
    .audit-step {
      border-left: 2px solid var(--border);
      margin-left: 9px; padding-left: 20px;
      margin-bottom: 4px; position: relative;
    }
    .audit-step-header {
      display: flex; align-items: baseline; gap: 10px;
      padding: 10px 0 6px; cursor: pointer;
    }
    .step-dot {
      width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
      position: absolute; left: -7px; top: 14px; background: var(--border);
    }
    .step-dot.interpretation { background: #60a5fa; }
    .step-dot.selection      { background: #34d399; }
    .step-dot.safety         { background: #a78bfa; }
    .step-dot.execution      { background: var(--accent); }
    .step-dot.log            { background: #94a3b8; }
    .step-dot.error          { background: #f87171; }

    .step-label   { font-size: 14px; font-weight: 600; color: var(--text); }
    .step-summary { font-size: 13px; color: var(--text-muted); margin-left: auto; text-align: right; max-width: 220px; }

    .audit-step-body      { display: none; padding-bottom: 12px; }
    .audit-step-body.open { display: block; }

    .data-grid {
      display: grid; grid-template-columns: 140px 1fr;
      gap: 6px 12px; font-size: 13px; margin-bottom: 10px;
    }
    .data-key {
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-light); padding-top: 2px;
    }
    .data-val { color: var(--text-muted); word-break: break-word; }

    .raw-row { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
    .raw-toggle, .raw-copy {
      font-size: 12px; color: var(--text-light);
      background: none; border: none; cursor: pointer;
      padding: 0; font-family: inherit;
    }
    .raw-toggle:hover, .raw-copy:hover { color: var(--accent); }
    .raw-copy { margin-left: auto; line-height: 0; padding: 2px; }
    .raw-json {
      display: none; font-size: 11px; font-family: monospace;
      color: var(--text-muted); background: var(--bg-alt);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 12px; overflow-x: auto; white-space: pre;
      margin-top: 4px; max-height: 200px; overflow-y: auto;
    }
    .raw-json.open { display: block; }

    /* ── Result badge ────────────────────────────────────────────── */
    .result-badge {
      display: inline-block; font-size: 11px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      padding: 2px 7px; border-radius: 4px; margin-bottom: 8px;
    }
    .result-badge.success { background: #dcfce7; color: #16a34a; }
    .result-badge.error   { background: #fee2e2; color: #dc2626; }
    .result-badge.pending { background: #fef9c3; color: #b45309; }

    /* ── Input area (sticky bottom) ──────────────────────────────── */
    .chat-input-wrapper {
      position: sticky;
      bottom: 0;
      background: var(--bg);
      border-top: 1px solid var(--border);
      z-index: 100;
      padding: 14px 0 20px;
    }

    .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .example-chip {
      font-size: 13px; padding: 5px 12px;
      border-radius: 100px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text-muted);
      cursor: pointer; font-family: inherit;
      transition: border-color 0.15s, color 0.15s;
    }
    .example-chip:hover { border-color: var(--accent); color: var(--accent); }

    .input-row {
      display: flex; align-items: flex-start; gap: 10px;
    }
    .input-row textarea {
      flex: 1; padding: 12px 14px;
      border: 1.5px solid var(--border); border-radius: var(--radius);
      font-family: inherit; font-size: 15px; color: var(--text);
      resize: none; min-height: 72px; line-height: 1.55;
      transition: border-color 0.15s; background: var(--bg);
    }
    .input-row textarea:focus { outline: none; border-color: var(--accent); }
    .input-row textarea::placeholder { color: var(--text-light); }

    .cal-btn {
      width: 44px; height: 44px;
      border-radius: var(--radius); border: 1.5px solid var(--border);
      background: var(--bg); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: var(--text-muted);
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }
    .cal-btn:hover, .cal-btn.open {
      border-color: var(--accent); background: var(--accent-light); color: var(--accent);
    }

    .send-btn {
      width: 44px; height: 44px;
      border-radius: var(--radius); border: none;
      background: var(--accent); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: #fff;
      transition: background 0.15s, transform 0.1s;
    }
    .send-btn:hover:not(:disabled) { background: var(--accent-hover); }
    .send-btn:active:not(:disabled) { transform: scale(0.96); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .input-btn-col {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }

    .cal-note {
      font-size: 13px; color: var(--text-light);
      margin: 6px 0 10px; line-height: 1.5;
    }

    /* ── Calendar panel ──────────────────────────────────────────── */
    .cal-panel {
      display: none; margin-bottom: 12px;
      padding: 16px; border: 1.5px solid var(--border);
      border-radius: var(--radius); background: var(--bg); box-shadow: var(--shadow);
    }
    .cal-panel.open { display: block; }

    .cal-grid-head {
      display: grid; grid-template-columns: repeat(7, 1fr);
      gap: 3px; margin-bottom: 3px;
    }
    .cal-grid-head span {
      text-align: center; font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--text-light); padding: 4px 0;
    }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .cal-day {
      aspect-ratio: 1; border-radius: 6px;
      font-size: 12px; font-weight: 500;
      border: 1.5px solid transparent; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: background 0.12s, border-color 0.12s;
      position: relative; user-select: none; gap: 1px; overflow: hidden; padding: 2px;
    }
    .cal-day-num  { font-size: 12px; font-weight: 600; line-height: 1.1; }
    .cal-day-name {
      font-size: 8px; font-weight: 700; letter-spacing: 0.02em;
      max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      text-align: center;
    }
    .cal-day.empty        { pointer-events: none; }
    .cal-day.free         { color: var(--text-muted); }
    .cal-day.free:hover   { background: var(--bg-alt); border-color: var(--border); }
    .cal-day.today        { border-color: var(--accent); color: var(--accent); font-weight: 700; }
    .cal-day.today:hover  { background: var(--accent-light); }
    .cal-day.busy-manual        { background: #fef2f2; border-color: #fecaca; color: #dc2626; }
    .cal-day.busy-manual:hover  { background: #fee2e2; }
    .cal-day.busy-system        { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
    .cal-day.busy-system:hover  { background: #dbeafe; }
    .cal-day.closed             { background: var(--bg-alt); color: var(--text-light); cursor: default; pointer-events: none; opacity: 0.45; }

    .day-tip {
      position: absolute; bottom: calc(100% + 6px); left: 50%;
      transform: translateX(-50%); background: var(--text); color: #fff;
      font-size: 11px; font-weight: 500; padding: 5px 10px; border-radius: 5px;
      white-space: nowrap; z-index: 50; pointer-events: none;
    }
    .day-tip::after {
      content: ""; position: absolute; top: 100%; left: 50%;
      transform: translateX(-50%); border: 4px solid transparent;
      border-top-color: var(--text);
    }

    .cal-legend { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
    .cal-legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
    .cal-legend-dot  { width: 10px; height: 10px; border-radius: 3px; }

    /* ── Send row ────────────────────────────────────────────────── */
    .run-row { display: flex; align-items: center; gap: 12px; margin-top: 4px; min-height: 20px; }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; display: none;
    }
    .spinner.active { display: block; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ──────────────────────────────────────────────── */
    @media (max-width: 640px) {
      .scenarios         { gap: 6px; }
      .scenario-card     { padding: 12px 14px; }
      .step-summary      { display: none; }
      .demo-header .title { display: none; }
      .chat-thread       { padding: 16px 16px 12px; }
      .chat-input-wrapper .container { padding: 0 16px; }
      .scenarios-panel .container    { padding: 0 16px; }
    }
  </style>
</head>
<body>

<header class="demo-header">
  <div class="inner">
    <a href="/" class="back">&#8592; How it works</a>
    <span class="title">Appointment Assistant &#8212; Live Demo</span>
    <button class="reset-btn" id="resetBtn">Reset</button>
  </div>
</header>

<!-- Scenario picker -->
<div class="scenarios-panel">
  <div class="container">
    <p class="section-label">Pick a scenario</p>
    <div class="scenarios" id="scenarios"></div>
  </div>
</div>

<!-- Chat thread grows here -->
<main class="chat-main">
  <div class="chat-thread" id="chatThread"></div>
</main>

<!-- Sticky input area -->
<div class="chat-input-wrapper">
  <div class="container">
    <div class="examples" id="examples"></div>
    <div class="input-row">
      <textarea id="messageInput"
        placeholder="e.g. Hi, I need to cancel my appointment today."
        rows="3"></textarea>
      <div class="input-btn-col">
        <button class="cal-btn" id="calBtn" title="View and edit schedule">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8"  y1="2" x2="8"  y2="6"/>
            <line x1="3"  y1="10" x2="21" y2="10"/>
          </svg>
        </button>
        <button class="send-btn" id="runBtn" title="Send">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path d="M5 10.5 L19 12 L5 4" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
            <path d="M5 13.5 L19 12 L5 20" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>
    <p class="cal-note">Client appointments show live. Click a booked day to switch to that account. Click a free day to block it manually.</p>
    <div class="cal-panel" id="calPanel">
      <div class="cal-grid-head">
        <span>Mon</span><span>Tue</span><span>Wed</span>
        <span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-legend">
        <div class="cal-legend-item">
          <div class="cal-legend-dot" style="background:var(--bg-alt);border:1.5px solid var(--border)"></div>
          Free
        </div>
        <div class="cal-legend-item">
          <div class="cal-legend-dot" style="background:var(--accent-light);border:1.5px solid var(--accent)"></div>
          Client appointment — click to select
        </div>
        <div class="cal-legend-item">
          <div class="cal-legend-dot" style="background:#fef2f2;border:1.5px solid #fecaca"></div>
          Manually blocked
        </div>
        <div class="cal-legend-item">
          <div class="cal-legend-dot" style="background:var(--bg-alt);border:1.5px solid var(--border);opacity:0.45"></div>
          Closed (Sunday)
        </div>
      </div>
    </div>
    <div class="run-row">
      <div class="spinner" id="spinner"></div>
    </div>
  </div>
</div>

<script src="demo.js?v=8"></script>
</body>
</html>
