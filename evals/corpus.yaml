# evals/corpus.yaml
#
# Evaluation corpus for the Hybrid AI Operations Agent.
#
# Each case defines:
#   id                   - unique identifier
#   message              - natural language input
#   account_id           - demo account to use (null for FAQ/policy only)
#   expected_tools       - list of tools the planner should select (routing accuracy)
#   expected_halt_reason - halt_reason after first call
#   expected_policy_outcome - brief label for policy layer test
#   notes                - optional context / edge case description
#
# Mock mode: LLM is bypassed; expected_tools is injected directly.
#   Tests: halt_reason + policy_outcome correctness.
#
# Live mode: real LLM is used; routing accuracy is measured against expected_tools.
#   Tests: routing accuracy + halt_reason + policy_outcome.
#
# Accounts:
#   demo-pass-monthly             active Pass, monthly, within refund window, no history
#   demo-pass-monthly-expired-window  active Pass, monthly, refund window expired (>14 days)
#   demo-bc-annual                active Black Card, annual billing, within refund window
#   demo-bc-cash                  active Black Card, cash payment, within refund window
#   demo-refund-used              Pass, monthly, lifetime refund already used
#   demo-pending                  active Pass, pending operation blocking new actions
#   demo-paused                   paused Pass

